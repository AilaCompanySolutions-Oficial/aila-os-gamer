name: Construir Aila OS Gamer

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"        # reconstrói todo dia para acompanhar as atualizações do Bazzite
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aila-os-gamer            # AMD / Intel
            base: ghcr.io/ublue-os/bazzite
          - image: aila-os-gamer-nvidia     # placas NVIDIA
            base: ghcr.io/ublue-os/bazzite-nvidia
    steps:
      # As imagens do Bazzite são enormes: usa todo o disco do servidor para guardar as camadas
      - name: Liberar espaço (as imagens são grandes)
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 6144
          swap-size-mb: 1024
          build-mount-path: /var/lib/containers
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - uses: actions/checkout@v4

      - name: Mostrar espaço livre
        run: df -h / /var/lib/containers

      - name: Construir
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          sudo podman build \
            --build-arg BASE_IMAGE="${{ matrix.base }}" \
            --build-arg BASE_TAG=stable \
            -t "ghcr.io/${OWNER}/${{ matrix.image }}:latest" \
            -f Containerfile .

      - name: Enviar para o ghcr.io
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "ghcr.io/${OWNER}/${{ matrix.image }}:latest"
